[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ifc-citygml"
version = "0.6.0"
description = "Traceable IFC-to-CityGML 3.0 building conversion and reproducible evaluation"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = ["ifcopenshell==0.9.0.post1", "numpy==2.5.4", "lxml==6.1.3", "shapely==2.2.0", "manifold3d==3.5.4", "trimesh==5.2.0", "networkx==3.7", "pyproj==3.8.0"]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]
research = ["psutil==7.2.2"]

[project.scripts]
ifc-citygml = "ifc_citygml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
ifc_citygml = ["resources/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
